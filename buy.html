<script>
(function () {
  var IL  = "https://mrng.to/BfPQpr1qio";
  var USD = "https://dotconnector2.gumroad.com/l/storyos/FOUNDING79";

  var f = document.getElementById("f"),
      country = document.getElementById("country"),
      hint = document.getElementById("hint"),
      err = document.getElementById("err");

  /* Israel is the only case where the buyer needs a heads-up, because the kit is priced in
     dollars on the site and their checkout is in shekels. Nobody else needs to be told
     anything about Israeli tax. */
  country.addEventListener("change", function () {
    hint.textContent = (country.value === "Israel")
      ? "Billed in shekels, with a tax invoice."
      : "";
  });

  /* Nothing is preselected on purpose. The country decides which tax applies, so it is the
     buyer's statement to make, not ours to guess. Both checkouts collect the email themselves,
     which is why this page does not ask for it twice. */

  f.addEventListener("submit", function (ev) {
    ev.preventDefault();
    err.style.display = "none";

    if (!country.value) {
      err.textContent = "Pick your country, so the invoice comes out right.";
      err.style.display = "block";
      country.focus();
      return;
    }

    /* The one number this page exists to produce: which door a buyer actually walked through.
       Bound to the submit, not to an href, because both destinations are off-site and the
       Israel/rest-of-world split is the interesting half.

       Two things here are deliberate and neither is decoration.

       try/catch: this line sits between the buyer clicking Continue and the checkout opening,
       and preventDefault above has already removed the browser's own fallback. If posthog is
       present but broken, an uncaught throw here means the button does nothing, silently, and
       the sale is lost with no error anywhere. Measurement never gets to stand in front of a
       purchase. If the event cannot be recorded, the buyer still goes to checkout.

       transport sendBeacon: a normal capture does not leave the tab in the same tick, so the
       navigation on the next line beats it and the event is dropped. sendBeacon posts it
       immediately and survives the unload. */
    var israel = country.value === "Israel";
    try {
      if (window.posthog) {
        posthog.capture('checkout_click', {
          product: 'storyos',
          rail: israel ? 'ils_morning' : 'usd_gumroad',
          country: country.value
        }, { transport: 'sendBeacon' });
      }
    } catch (e) { /* the sale outranks the metric, always */ }

    window.location.href = israel ? IL : USD;
  });
})();
</script>
